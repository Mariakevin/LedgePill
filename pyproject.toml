[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ledge-pill"
version = "1.0.0"
description = "A Dynamic Island for your Linux desktop — fluid, native, and light on your battery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maria Kevin", email = "mariakevin0504@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["PyGObject>=3.48"]

[project.urls]
Homepage = "https://github.com/Mariakevin/LedgePill"

[project.scripts]
ledge-pill = "ledgepill.app:main"

[tool.setuptools.packages.find]
include = ["ledgepill*"]

[tool.setuptools.package-data]
"ledgepill.ui" = ["*.css", "*.svg"]
